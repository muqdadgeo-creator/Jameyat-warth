name: Fix in-kind JS syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair only latest in-kind register escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = r"alert(\\'رقم هاتف المتبرع غير مسجل.\\')"
          new = r"alert(\'رقم هاتف المتبرع غير مسجل.\')"
          if old not in s:
              raise SystemExit("target escaping not found")
          s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-inkind-js.yml
          git commit -m "fix: restore in-kind register JavaScript execution"
          git push
