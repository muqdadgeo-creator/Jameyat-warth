name: Patch inventory priority phone actions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact phone actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='title="اتصال بالمستفيد" style="text-decoration:none;padding:6px 8px">📞 اتصال</a><a class="action" href="https://wa.me/${escapeHtml(wa)}" target="_blank" rel="noopener" title="واتساب"'
          new='title="اتصال مباشر بالمستفيد" style="text-decoration:none;padding:6px 8px">📞 مباشر</a><a class="action" href="https://wa.me/${escapeHtml(wa)}" target="_blank" rel="noopener" title="فتح واتساب مع المستفيد"'
          if old not in s:
              raise SystemExit("target not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "تفعيل الاتصال المباشر وواتساب في أولوية تسليم الأجهزة"
          git push
      - name: Remove patch workflow
        if: always()
        run: |
          git rm .github/workflows/patch-inventory-priority.yml || true
          git commit -m "إزالة مهمة التعديل المؤقتة" || true
          git push || true
