name: One-time in-kind donations UI layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-ui:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch index
        run: python3 tools/patch_inkind_layout.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "تعديل ترتيب نافذة التبرعات العينية"
          git push origin main
      - name: Remove temporary files
        run: |
          git rm -f .github/workflows/one-time-inkind-layout.yml tools/patch_inkind_layout.py
          git commit -m "chore: remove temporary in-kind layout patch"
          git push origin main
