name: Refine moving ticker motion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-ticker-motion.yml"

permissions:
  contents: write

jobs:
  refine-ticker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply slow fade to ticker text only
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old_css = """#warithTickerMessage{display:block;width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap;font-weight:800;color:#205b49;opacity:1;transform:translateX(0);transition:opacity .35s ease,transform .35s ease}
          #warithTickerMessage.wvtick-enter{animation:warithTickerEnter .45s ease both}
          @keyframes warithTickerEnter{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}"""
          new_css = """#warithTickerMessage{display:block;width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap;font-weight:800;color:#205b49;opacity:1;transform:translateX(0);transition:opacity 1.1s ease-in-out,transform 1.1s ease-in-out}
          #warithTickerMessage.wvtick-enter{animation:warithTickerEnter 1.1s ease-in-out both}
          @keyframes warithTickerEnter{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:translateX(0)}}"""

          old_js = "const msg=messages[idx];warithTickerCurrentKey=msg.key;el.textContent=msg.text;const viewport=document.getElementById('warithTickerViewport');el.style.fontSize='';if(viewport){let size=11;while(el.scrollWidth>viewport.clientWidth&&size>8){size=Math.max(8,size-.5);el.style.fontSize=size+'px'}}el.classList.remove('wvtick-enter');void el.offsetWidth;el.classList.add('wvtick-enter')"
          new_js = "const msg=messages[idx];warithTickerCurrentKey=msg.key;const viewport=document.getElementById('warithTickerViewport');el.classList.remove('wvtick-enter');el.style.opacity='0';window.setTimeout(()=>{el.textContent=msg.text;el.style.fontSize='';if(viewport){let size=11;while(el.scrollWidth>viewport.clientWidth&&size>8){size=Math.max(8,size-.5);el.style.fontSize=size+'px'}}el.style.opacity='';void el.offsetWidth;el.classList.add('wvtick-enter')},550)"

          if old_css not in s:
              # Accept a previous partial application, but fail safely if the ticker CSS is unknown.
              if new_css not in s:
                  raise SystemExit("Ticker CSS did not match expected version; no changes made.")
          else:
              s = s.replace(old_css, new_css, 1)

          if old_js in s:
              s = s.replace(old_js, new_js, 1)
          elif new_js not in s:
              raise SystemExit("Ticker rotation code did not match expected version; no changes made.")

          p.write_text(s, encoding="utf-8")
      - name: Commit ticker-only change
        shell: bash
        run: |
          git config user.name "muqdadgeo-creator"
          git config user.email "muqdadgeo@gmail.com"
          if git diff --quiet -- index.html; then
            echo "No ticker changes needed."
            exit 0
          fi
          git add index.html
          git commit -m "Smooth ticker text fade without changing timing"
          git push
