  warithSyncChannel=window.warithSupabase.channel('warith-client-sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'client_sync_records'},warithSyncApplyRealtime)
    .subscribe(status=>console.log('Warith sync realtime:',status));
}"""
          new="""let warithSyncReconnectTimer=null;
let warithSyncLastRealtimeStatus='';

function warithSyncStopRealtime(){
  if(warithSyncReconnectTimer){clearTimeout(warithSyncReconnectTimer);warithSyncReconnectTimer=null;}
  if(warithSyncChannel){
    try{warithSyncChannel.unsubscribe();}catch(e){}
    warithSyncChannel=null;
  }
}
function warithSyncScheduleReconnect(){
  if(warithSyncReconnectTimer||!window.warithSupabase||!warithSyncReady)return;
  warithSyncReconnectTimer=setTimeout(()=>{warithSyncReconnectTimer=null;warithSyncStartRealtime(true);},3000);
}
function warithSyncStartRealtime(force=false){
  if(!window.warithSupabase||!warithSyncReady)return;
  if(warithSyncChannel&&!force)return;
  if(force)warithSyncStopRealtime();
  warithSyncChannel=window.warithSupabase.channel('warith-client-sync-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'client_sync_records'},warithSyncApplyRealtime)
    .subscribe((status,err)=>{
      warithSyncLastRealtimeStatus=status;
      console.log('Warith sync realtime:',status,err||'');
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        warithSyncChannel=null;
        warithSyncScheduleReconnect();
      }
    });
}"""
