name: Fix left gap and sidebar menu
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-left-gap-and-sidebar.yml"

permissions:
  contents: write

jobs:
  fix-layout-and-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted page width and sidebar fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = '<style id="warith-left-gap-sidebar-fix">'
          if marker in s:
              print("Targeted layout/sidebar fix already present")
              raise SystemExit(0)
          css = """<style id="warith-left-gap-sidebar-fix">
          /* Remove the oversized empty side gutters without global overflow rules. */
          .app {
            width: 100%;
            max-width: none;
            margin: 0;
          }
          /* Keep the menu trigger visible above the header content. */
          header > .icon {
            z-index: 30;
            display: grid;
            place-items: center;
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
          }
          /* Ensure the drawer opens above the app and its menu remains reachable. */
          .drawer {
            z-index: 9999;
          }
          .drawer.open {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
          }
          .drawer.open .menu {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
          }
          .drawer .menu {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            overflow-y: auto;
          }
          </style>"""
          if "</head>" not in s:
              raise SystemExit("Could not find </head>; index.html was not changed")
          p.write_text(s.replace("</head>", css + "</head>", 1), encoding="utf-8")
      - name: Commit targeted fixes
        shell: bash
        run: |
          git config user.name "muqdadgeo-creator"
          git config user.email "muqdadgeo@gmail.com"
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git add index.html
          git commit -m "Fix left page gap and sidebar menu visibility"
          git push
