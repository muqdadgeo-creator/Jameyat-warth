name: Fix association header layout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-header-layout.yml"

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide association name and preserve logo
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = '<style id="header-brand-text-hide-fix">'
          if marker in s:
              print("Header title is already hidden")
              raise SystemExit(0)
          css = '''<style id="header-brand-text-hide-fix">
          header>.brand{display:none!important}
          </style>'''
          if "</head>" not in s:
              raise SystemExit("Could not find </head>; leaving index unchanged")
          p.write_text(s.replace("</head>", css + "</head>", 1), encoding="utf-8")
      - name: Commit header title change
        shell: bash
        run: |
          git config user.name "muqdadgeo-creator"
          git config user.email "muqdadgeo@gmail.com"
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git add index.html
          git commit -m "Hide association name in main header"
          git push
