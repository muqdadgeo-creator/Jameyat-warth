name: Adjust electronic stamp position and angle in all reports

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/adjust-electronic-stamp-print.yml"

permissions:
  contents: write

jobs:
  adjust-stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply A4 print stamp adjustment across reports
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = '<style id="electronic-stamp-a4-position-angle">'
          style = """<style id="electronic-stamp-a4-position-angle">
          @media print {
            img[src*="stamp.png"],
            [style*="stamp.png"] {
              transform: translateY(-1cm) rotate(-45deg) !important;
              transform-origin: center center !important;
            }
          }
          </style>"""

          if marker in s:
              start = s.find(marker)
              end = s.find("</style>", start)
              if end < 0:
                  raise SystemExit("Existing stamp adjustment style is not closed; no changes made.")
              s = s[:start] + style + s[end + len("</style>"):]
          elif "</head>" in s:
              s = s.replace("</head>", style + "\\n</head>", 1)
          else:
              raise SystemExit("Could not find </head>; no changes made.")

          p.write_text(s, encoding="utf-8")
      - name: Commit and push report print adjustment
        shell: bash
        run: |
          git config user.name "muqdadgeo-creator"
          git config user.email "muqdadgeo@gmail.com"
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git add index.html
          git commit -m "Adjust electronic stamp on A4 report printing"
          git push
