name: Fix app icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add icon links
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          if 'rel="icon"' in s:
              print("Icon links already exist")
          else:
              m=re.search(r'<div class="logo"><img[^>]*src="(data:image/png;base64,[^"]+)"',s,re.I)
              if not m:
                  raise SystemExit("Could not locate embedded logo")
              src=m.group(1)
              tags=f'<link rel="icon" type="image/png" href="{src}"/>\n<link rel="apple-touch-icon" href="{src}"/>\n'
              s=s.replace("</head>",tags+"</head>",1)
              p.write_text(s,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/fix-app-icons.yml
          git commit -m "Add app and browser icons"
          git push
