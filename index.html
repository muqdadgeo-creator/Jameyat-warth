<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<title>العوائل | جمعية وارث الخيرية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#193a33;font-family:Tahoma,Arial,sans-serif}
.app{max-width:520px;min-height:100vh;margin:auto;background:#f3f6f5}
header{background:#0f5c4d;color:#fff;padding:13px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}
.logo{width:42px;height:42px;border-radius:50%;background:#d7b45a;color:#0f5c4d;display:grid;place-items:center;font-weight:900}
.brand{flex:1}.brand b{display:block;font-size:16px}.brand small{font-size:10px;opacity:.8}
.icon{border:0;background:#ffffff1b;color:#fff;width:42px;height:42px;border-radius:12px;font-size:20px}
main{padding:16px 14px 85px}.top{display:flex;align-items:center;gap:10px;margin-bottom:15px}.back{border:0;background:#fff;color:#0f5c4d;border-radius:12px;padding:10px 13px;font-weight:bold;box-shadow:0 2px 8px #0000000d}.title{font-size:23px;font-weight:900;flex:1}.count{font-size:11px;color:#748780}
.search{background:#fff;border-radius:16px;padding:6px;display:flex;align-items:center;gap:5px;box-shadow:0 2px 10px #0000000b;margin-bottom:10px}.search input{border:0;outline:0;flex:1;padding:10px;font:inherit;font-size:12px;background:transparent}.search button{border:0;background:#0f5c4d;color:#fff;border-radius:11px;width:40px;height:40px;font-size:18px}
.filterbar{display:flex;gap:7px;overflow:auto;padding:2px 1px 10px}.chip{white-space:nowrap;border:1px solid #d7e3df;background:#fff;border-radius:20px;padding:8px 11px;color:#41635b;font-size:10px}.chip.active{background:#e5f1ed;border-color:#b8d6cd;color:#0f5c4d;font-weight:bold}
.actions{display:flex;gap:8px;margin:4px 0 13px}.action{flex:1;border:0;border-radius:13px;padding:11px;background:#fff;color:#34564e;font-size:11px;font-weight:bold}.primary{background:#0f5c4d;color:#fff}
.card{background:#fff;border-radius:17px;padding:13px;margin-bottom:10px;box-shadow:0 2px 10px #0000000b}.row{display:flex;gap:10px;align-items:center}.avatar{width:47px;height:47px;border-radius:14px;background:#e5f1ed;color:#0f5c4d;display:grid;place-items:center;font-weight:900;font-size:17px}.grow{flex:1}.code{font-size:10px;color:#0f5c4d;font-weight:bold}.name{font-size:15px;font-weight:900;margin-top:3px}.sub{font-size:10px;color:#7a8985;margin-top:3px}.badge{background:#e9f5f0;color:#0f5c4d;border-radius:20px;padding:5px 8px;font-size:9px}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:11px}.meta div{background:#f4f7f6;border-radius:9px;padding:7px;font-size:10px;color:#5b716b}.meta b{color:#294d44}
.more{border:0;background:#f0f5f3;color:#365850;width:34px;height:34px;border-radius:10px;font-size:19px}
.empty{text-align:center;padding:35px;color:#7c8d88;font-size:12px}.fab{position:fixed;bottom:18px;right:max(18px,calc((100vw - 520px)/2 + 18px));width:57px;height:57px;border:0;border-radius:19px;background:#0f5c4d;color:#fff;font-size:28px;box-shadow:0 6px 18px #0f5c4d55}
.drawer{position:fixed;inset:0;background:#0006;z-index:20;display:none}.drawer.open{display:block}.menu{width:84%;max-width:360px;height:100%;background:#fff;padding:18px}.menu button{width:100%;border:0;background:#fff;text-align:right;padding:13px;border-radius:10px;font:inherit;color:#274a42}.menu button:hover{background:#eef5f2}
</style>
</head>
<body>
<div class="app">
<header><button class="icon" onclick="openMenu()">☰</button><div class="logo">و</div><div class="brand"><b>جمعية وارث الخيرية</b><small>العوائل</small></div><button class="icon">🔔</button></header>
<main>
<div class="top"><button class="back" onclick="alert('← الرجوع للرئيسية')">← رجوع</button><div class="title">العوائل</div><div class="count" id="count"></div></div>
<div class="search"><span>🔎</span><input id="q" placeholder="ابحث برقم العائلة أو المعرف أو الاسم" oninput="render()"><button onclick="alert('الفلاتر المتقدمة')">☷</button></div>
<div class="filterbar"><button class="chip active">الكل</button><button class="chip">مستمر</button><button class="chip">مفتوح</button><button class="chip">ملك</button><button class="chip">إيجار</button><button class="chip">حقوق</button></div>
<div class="actions"><button class="action primary" onclick="alert('نموذج إضافة عائلة')">＋ إضافة عائلة</button><button class="action" onclick="alert('ترتيب العوائل')">↕ ترتيب</button></div>
<div id="list"></div>
</main>
<button class="fab" onclick="alert('إضافة عائلة جديدة')">＋</button>
</div>
<div class="drawer" id="drawer" onclick="closeMenu(event)"><div class="menu" onclick="event.stopPropagation()"><div style="display:flex;gap:10px;align-items:center;margin-bottom:16px"><div class="logo">و</div><b>جمعية وارث الخيرية</b></div><button onclick="closeMenu()">🏠 الرئيسية</button><button onclick="closeMenu()">👨‍👩‍👧‍👦 العوائل</button><button onclick="closeMenu()">💝 التبرعات</button><button onclick="closeMenu()">📋 المناشدات</button><button onclick="closeMenu()">📦 المخزن</button><button onclick="closeMenu()">💵 المالية</button><button onclick="closeMenu()">📊 التقارير</button></div></div>
<script>
const data=[
{c:651,n:'عائلة أحمد عبد',i:'أبو حسن',m:5,j:'عامل',s:'350,000 د.ع',h:'إيجار',r:'ش',st:'مستمر'},
{c:652,n:'عائلة علي كاظم',i:'أبو علي',m:4,j:'موظف',s:'500,000 د.ع',h:'ملك',r:'س',st:'مستمر'},
{c:653,n:'عائلة محمد جاسم',i:'أبو محمد',m:7,j:'كاسب',s:'250,000 د.ع',h:'مع الأهل',r:'هـ',st:'مفتوح'},
{c:654,n:'عائلة حسين عباس',i:'أبو زهراء',m:3,j:'عامل',s:'300,000 د.ع',h:'إيجار',r:'ع',st:'مستمر'}
];
function render(){
let q=document.getElementById('q').value.trim().toLowerCase();
let a=data.filter(x=>[x.c,x.n,x.i,x.j,x.h,x.r,x.st].join(' ').toLowerCase().includes(q));
document.getElementById('count').textContent=a.length+' عائلة';
document.getElementById('list').innerHTML=a.length?a.map(x=>`<div class="card" onclick="alert('فتح ملف العائلة رقم ${x.c}')"><div class="row"><div class="avatar">${x.n[6]||'ع'}</div><div class="grow"><div class="code">رقم العائلة #${x.c}</div><div class="name">${x.n}</div><div class="sub">المعرف: ${x.i}</div></div><span class="badge">${x.st}</span><button class="more" onclick="event.stopPropagation();alert('تعديل / عرض / إخفاء')">⋮</button></div><div class="meta"><div>👨‍👩‍👧 <b>${x.m}</b> أفراد</div><div>💼 <b>${x.j}</b></div><div>💰 <b>${x.s}</b></div><div>🏠 <b>${x.h}</b></div><div>⚖️ الحقوق: <b>${x.r}</b></div><div>📍 الموقع: <b>محفوظ</b></div></div></div>`).join(''):'<div class="empty">لا توجد عوائل مطابقة للبحث</div>';
}
function openMenu(){document.getElementById('drawer').classList.add('open')}function closeMenu(e){if(!e||e.target.id==='drawer')document.getElementById('drawer').classList.remove('open')}render();
</script>
</body>
</html>
